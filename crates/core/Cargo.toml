[package]
name = "enderlink-core"
version = "0.3.3"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
walkdir = "2"
unicode-normalization = "0.1"
sysinfo = "0.37"
fs2 = "0.4"
hickory-resolver = "0.24"
futures-util = "0.3"
rand = "0.9"
libc = "0.2"
keepawake = "0.6.1"
keyring = "3"
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.2.0" }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", tag = "v1.2.0" }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
