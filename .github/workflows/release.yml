name: Release desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            bundles: dmg
          - name: windows-x64
            os: windows-2022
            bundles: nsis
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: npm ci
      - run: node scripts/check-version.cjs
      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Install WebKit with Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps webkit
      - name: Install WebKit on macOS
        if: runner.os == 'macOS'
        run: npx playwright install webkit
      - name: Validate source and tests on macOS/Linux
        if: runner.os != 'Windows'
        env:
          ENDERLINK_VALIDATE_WEBKIT: "1"
        run: npm run validate
      - name: Validate source and tests on Windows
        if: runner.os == 'Windows'
        run: npm run validate
      - name: Build installer
        run: npm run tauri -w apps/desktop -- build --bundles ${{ matrix.bundles }} --ci
      - name: Collect release assets
        run: node scripts/collect-release-assets.cjs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: enderlink-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "Enderlink $GITHUB_REF_NAME"
          fi
